name: Build desktop downloads

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop packager
        run: python -m pip install ".[desktop]"
      - name: Package BRNA Studio
        run: python -m PyInstaller --clean --noconfirm brna-studio.spec
      - name: Create portable archive
        run: python scripts/archive_desktop.py --platform "${{ matrix.platform }}" --output "dist/brna-studio-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: brna-studio-${{ matrix.platform }}
          path: dist/brna-studio-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: brna-studio-*
          path: release
          merge-multiple: true
      - name: Publish desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes --title "BRNA Studio $GITHUB_REF_NAME"
