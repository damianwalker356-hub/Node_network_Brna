name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,reasoning]'
      - run: ruff check src tests
      - run: pytest
      - run: pytest -m slow
      - run: python -m brna.reporting --results results/run_records --out docs/verification_report.md
      - run: git diff --exit-code -- docs/verification_report.md
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:web
